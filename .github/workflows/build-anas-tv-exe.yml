name: Build AnasTV Windows EXE

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

defaults:
  run:
    working-directory: anas_tv_flutter
    shell: pwsh

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure NuGet CLI for WebView2 build
        run: |
          if (-not (Get-Command nuget -ErrorAction SilentlyContinue)) {
            $nugetDir = "$env:RUNNER_TEMP\nuget"
            New-Item -ItemType Directory -Force -Path $nugetDir | Out-Null
            try {
              Invoke-WebRequest -Uri "https://dist.nuget.org/win-x86-commandline/latest/nuget.exe" -OutFile "$nugetDir\nuget.exe" -UseBasicParsing
              "$nugetDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            } catch {
              choco install nuget.commandline -y --no-progress
            }
          }

      - name: Generate Windows project files and set AnasTV branding
        run: |
          if (-not (Test-Path "windows")) {
            flutter create --platforms=windows --org com.anas.tv .
          }
          if (Test-Path "windows/CMakeLists.txt") {
            $cmake = Get-Content "windows/CMakeLists.txt" -Raw
            $cmake = $cmake -replace 'set\(\s*BINARY_NAME\s+"[^"]+"\s*\)', 'set(BINARY_NAME "AnasTV")'
            Set-Content "windows/CMakeLists.txt" $cmake -NoNewline
          }
          if (Test-Path "windows/runner/main.cpp") {
            $cpp = Get-Content "windows/runner/main.cpp" -Raw
            $cpp = $cpp -replace 'L"anas_tv"', 'L"AnasTV"'
            Set-Content "windows/runner/main.cpp" $cpp -NoNewline
          }
          if (Test-Path "windows/runner/Runner.rc") {
            $rc = Get-Content "windows/runner/Runner.rc" -Raw
            $rc = $rc -replace '"anas_tv(\.exe)?"', '"AnasTV$1"'
            Set-Content "windows/runner/Runner.rc" $rc -NoNewline
          }

      - name: Bundle Jio loader asset
        run: |
          New-Item -ItemType Directory -Force -Path "assets/images" | Out-Null
          if (Test-Path "../public/assets/aistudio/jio_b70b9fac.svg") {
            Copy-Item "../public/assets/aistudio/jio_b70b9fac.svg" "assets/images/jio_logo.svg" -Force
          }
          if (Test-Path "../public/assets/aistudio/JPEG_Download_Jio-Logo-Colour-Navi-Midnight_c9b3d304.jpg") {
            Copy-Item "../public/assets/aistudio/JPEG_Download_Jio-Logo-Colour-Navi-Midnight_c9b3d304.jpg" "assets/images/jio_loader.jpg" -Force
          }

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Release EXE (Shaka Player Web)
        run: flutter build windows --release -t lib/main_pc.dart

      - name: Package Single Standalone AnasTV.exe
        run: |
          $releaseDir = if (Test-Path "build/windows/x64/runner/Release") {
            (Resolve-Path "build/windows/x64/runner/Release").Path
          } else {
            (Resolve-Path "build/windows/runner/Release").Path
          }

          if (-not (Test-Path "$releaseDir\AnasTV.exe")) {
            $fallbackExe = Get-ChildItem -Path $releaseDir -Filter "*.exe" | Select-Object -First 1
            if ($fallbackExe) {
              Rename-Item -Path $fallbackExe.FullName -NewName "AnasTV.exe"
            } else {
              throw "AnasTV.exe not found in $releaseDir"
            }
          }

          # Bundle Visual C++ x64 runtime DLLs so fresh Windows PCs never crash on startup
          foreach ($dll in @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll")) {
            $sysDll = Join-Path $env:WINDIR "System32\$dll"
            $dstDll = Join-Path $releaseDir $dll
            if ((Test-Path $sysDll) -and (-not (Test-Path $dstDll))) {
              Copy-Item $sysDll $dstDll -Force
            }
          }

          # Ensure 7z CLI is available
          $sevenZip = Get-Command 7z -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $sevenZip -and (Test-Path "C:\Program Files\7-Zip\7z.exe")) {
            $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          }
          if (-not $sevenZip) {
            choco install 7zip -y --no-progress
            $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          }
          if (-not (Test-Path $sevenZip)) {
            throw "7z.exe not found"
          }

          $sfxWork = Join-Path $env:RUNNER_TEMP "anas_sfx"
          New-Item -ItemType Directory -Force -Path $sfxWork | Out-Null

          $extra7z = Join-Path $sfxWork "7z_extra.7z"
          $sfxUrls = @(
            "https://www.7-zip.org/a/7z2409-extra.7z",
            "https://www.7-zip.org/a/7z2408-extra.7z",
            "https://www.7-zip.org/a/7z2301-extra.7z"
          )
          $downloaded = $false
          foreach ($u in $sfxUrls) {
            try {
              Invoke-WebRequest -Uri $u -OutFile $extra7z -UseBasicParsing
              if ((Test-Path $extra7z) -and ((Get-Item $extra7z).Length -gt 100000)) {
                $downloaded = $true
                break
              }
            } catch {}
          }
          if (-not $downloaded) {
            throw "Failed to download 7-Zip Extra SFX module"
          }

          $sfxExtracted = Join-Path $sfxWork "extra"
          & $sevenZip x $extra7z "-o$sfxExtracted" -y | Out-Null

          $sfxStubItem = $null
          $needsConfig = $true
          foreach ($candidateName in @("7zSD.sfx", "7zS.sfx", "7zS2.sfx")) {
            $matches = Get-ChildItem -Path $sfxExtracted -Recurse -Filter $candidateName -File | Sort-Object {
              if ($_.FullName -match 'x64|amd64') { 0 } elseif ($_.FullName -match 'arm') { 2 } else { 1 }
            }
            $picked = $matches | Select-Object -First 1
            if ($picked) {
              $sfxStubItem = $picked
              $needsConfig = ($candidateName -ne "7zS2.sfx")
              break
            }
          }
          if (-not $sfxStubItem) {
            $allFiles = (Get-ChildItem -Path $sfxExtracted -Recurse -File | ForEach-Object { $_.FullName }) -join ", "
            throw "No supported installer SFX found in extra archive. Files: $allFiles"
          }
          $sfxStub = $sfxStubItem.FullName
          Write-Host "Using SFX module: $sfxStub (config=$needsConfig)"

          # Compress Release directory using LZMA (compatible with all 7-Zip SFX modules)
          $payload7z = Join-Path $sfxWork "payload.7z"
          if (Test-Path $payload7z) { Remove-Item $payload7z -Force }
          Push-Location $releaseDir
          try {
            & $sevenZip a -t7z -m0=LZMA -mx=5 $payload7z * -r
          } finally {
            Pop-Location
          }
          if (-not (Test-Path $payload7z)) {
            throw "payload.7z creation failed"
          }

          # Write UTF-8 (no BOM) config for silent temp extraction + auto cleanup when supported
          $parts = @($sfxStub)
          if ($needsConfig) {
            $cfgPath = Join-Path $sfxWork "config.txt"
            $cfgText = ";!@Install@!UTF-8!`r`nTitle=`"AnasTV`"`r`nProgress=`"no`"`r`nRunProgram=`"AnasTV.exe`"`r`n;!@InstallEnd@!`r`n"
            [System.IO.File]::WriteAllText($cfgPath, $cfgText, [System.Text.UTF8Encoding]::new($false))
            $parts += $cfgPath
          }
          $parts += $payload7z

          $outExe = Join-Path (Resolve-Path "build").Path "AnasTV.exe"
          if (Test-Path $outExe) { Remove-Item $outExe -Force }
          $outStream = [System.IO.File]::Create($outExe)
          try {
            foreach ($part in $parts) {
              $inStream = [System.IO.File]::OpenRead($part)
              try {
                $inStream.CopyTo($outStream)
              } finally {
                $inStream.Dispose()
              }
            }
          } finally {
            $outStream.Dispose()
          }
          if (-not (Test-Path $outExe)) {
            throw "Failed to assemble single standalone AnasTV.exe"
          }
          $exeMb = [math]::Round((Get-Item $outExe).Length / 1MB, 2)
          Write-Host "Built single standalone AnasTV.exe ($exeMb MB)"

      - name: Upload Single Standalone AnasTV.exe
        uses: actions/upload-artifact@v4
        with:
          name: AnasTV-Windows-Single-EXE
          path: anas_tv_flutter/build/AnasTV.exe
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

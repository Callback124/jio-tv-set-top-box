name: Build AnasTV Windows EXE

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

defaults:
  run:
    working-directory: anas_tv_flutter
    shell: pwsh

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure NuGet CLI for WebView2 build
        run: |
          if (-not (Get-Command nuget -ErrorAction SilentlyContinue)) {
            $nugetDir = "$env:RUNNER_TEMP\nuget"
            New-Item -ItemType Directory -Force -Path $nugetDir | Out-Null
            try {
              Invoke-WebRequest -Uri "https://dist.nuget.org/win-x86-commandline/latest/nuget.exe" -OutFile "$nugetDir\nuget.exe" -UseBasicParsing
              "$nugetDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            } catch {
              choco install nuget.commandline -y --no-progress
            }
          }

      - name: Generate Windows project files and set AnasTV branding
        run: |
          if (-not (Test-Path "windows")) {
            flutter create --platforms=windows --org com.anas.tv .
          }
          if (Test-Path "windows/CMakeLists.txt") {
            $cmake = Get-Content "windows/CMakeLists.txt" -Raw
            $cmake = $cmake -replace 'set\(\s*BINARY_NAME\s+"[^"]+"\s*\)', 'set(BINARY_NAME "AnasTV")'
            Set-Content "windows/CMakeLists.txt" $cmake -NoNewline
          }
          if (Test-Path "windows/runner/main.cpp") {
            $cpp = Get-Content "windows/runner/main.cpp" -Raw
            $cpp = $cpp -replace 'L"anas_tv"', 'L"AnasTV"'
            Set-Content "windows/runner/main.cpp" $cpp -NoNewline
          }
          if (Test-Path "windows/runner/Runner.rc") {
            $rc = Get-Content "windows/runner/Runner.rc" -Raw
            $rc = $rc -replace '"anas_tv(\.exe)?"', '"AnasTV$1"'
            Set-Content "windows/runner/Runner.rc" $rc -NoNewline
          }

      - name: Bundle Jio loader asset
        run: |
          New-Item -ItemType Directory -Force -Path "assets/images" | Out-Null
          if (Test-Path "../public/assets/aistudio/jio_b70b9fac.svg") {
            Copy-Item "../public/assets/aistudio/jio_b70b9fac.svg" "assets/images/jio_logo.svg" -Force
          }
          if (Test-Path "../public/assets/aistudio/JPEG_Download_Jio-Logo-Colour-Navi-Midnight_c9b3d304.jpg") {
            Copy-Item "../public/assets/aistudio/JPEG_Download_Jio-Logo-Colour-Navi-Midnight_c9b3d304.jpg" "assets/images/jio_loader.jpg" -Force
          }

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Release EXE (Shaka Player Web)
        run: flutter build windows --release -t lib/main_pc.dart

      - name: Set up NSIS
        uses: nsis-dev/setup-nsis@v1
        continue-on-error: true
        with:
          version: "latest"

      - name: Package Single Standalone AnasTV.exe
        run: |
          $releaseDir = if (Test-Path "build/windows/x64/runner/Release") {
            (Resolve-Path "build/windows/x64/runner/Release").Path
          } else {
            (Resolve-Path "build/windows/runner/Release").Path
          }

          if (-not (Test-Path "$releaseDir\AnasTV.exe")) {
            $fallbackExe = Get-ChildItem -Path $releaseDir -Filter "*.exe" | Select-Object -First 1
            if ($fallbackExe) {
              Rename-Item -Path $fallbackExe.FullName -NewName "AnasTV.exe"
            } else {
              throw "AnasTV.exe not found in $releaseDir"
            }
          }

          # Bundle Visual C++ x64 runtime DLLs so fresh Windows PCs never crash on startup
          foreach ($dll in @("vcruntime140.dll", "vcruntime140_1.dll", "vcruntime140_threads.dll", "msvcp140.dll", "msvcp140_1.dll")) {
            $sysDll = Join-Path $env:WINDIR "System32\$dll"
            $dstDll = Join-Path $releaseDir $dll
            if ((Test-Path $sysDll) -and (-not (Test-Path $dstDll))) {
              Copy-Item $sysDll $dstDll -Force
            }
          }

          # Locate makensis.exe (installed via nsis-dev/setup-nsis or fallback Chocolatey)
          $makensis = Get-Command makensis -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $makensis) {
            foreach ($p in @("C:\Program Files (x86)\NSIS\makensis.exe", "C:\Program Files\NSIS\makensis.exe")) {
              if (Test-Path $p) {
                $makensis = $p
                break
              }
            }
          }
          if (-not $makensis) {
            choco install nsis -y --no-progress
            foreach ($p in @("C:\Program Files (x86)\NSIS\makensis.exe", "C:\Program Files\NSIS\makensis.exe")) {
              if (Test-Path $p) {
                $makensis = $p
                break
              }
            }
          }
          if (-not $makensis -or -not (Test-Path $makensis)) {
            throw "makensis.exe not found"
          }
          Write-Host "Using NSIS compiler: $makensis"

          $nsisWork = Join-Path $env:RUNNER_TEMP "anas_nsis"
          New-Item -ItemType Directory -Force -Path $nsisWork | Out-Null

          $buildRoot = (Resolve-Path "build").Path
          $outExe = Join-Path $buildRoot "AnasTV.exe"
          if (Test-Path $outExe) { Remove-Item $outExe -Force }

          $nsiLines = [System.Collections.Generic.List[string]]::new()
          $nsiLines.Add('Unicode True')
          $nsiLines.Add('SetCompressor zlib')
          $nsiLines.Add('Name "AnasTV"')
          $nsiLines.Add('Caption "AnasTV"')
          $nsiLines.Add("OutFile `"$outExe`"")
          $nsiLines.Add('RequestExecutionLevel user')
          $nsiLines.Add('SilentInstall silent')
          if (Test-Path "windows/runner/resources/app_icon.ico") {
            $iconPath = (Resolve-Path "windows/runner/resources/app_icon.ico").Path
            $nsiLines.Add("Icon `"$iconPath`"")
          }
          $nsiLines.Add('VIProductVersion "1.0.0.0"')
          $nsiLines.Add('VIAddVersionKey "ProductName" "AnasTV"')
          $nsiLines.Add('VIAddVersionKey "FileDescription" "AnasTV Desktop Player"')
          $nsiLines.Add('VIAddVersionKey "FileVersion" "1.0.0.0"')
          $nsiLines.Add('VIAddVersionKey "LegalCopyright" "AnasTV"')
          $nsiLines.Add('Section "RunAnasTV"')
          $nsiLines.Add('  InitPluginsDir')
          $nsiLines.Add('  SetOutPath "$PLUGINSDIR"')
          $nsiLines.Add('  SetOverwrite on')
          $nsiLines.Add("  File /r `"$releaseDir\*.*`"")
          $nsiLines.Add('  ExecWait ''"$PLUGINSDIR\AnasTV.exe"'' $0')
          $nsiLines.Add('  SetOutPath "$TEMP"')
          $nsiLines.Add('SectionEnd')

          $nsiPath = Join-Path $nsisWork "anas_portable.nsi"
          [System.IO.File]::WriteAllText($nsiPath, ($nsiLines -join "`r`n"), [System.Text.UTF8Encoding]::new($false))

          & $makensis $nsiPath
          if ($LASTEXITCODE -ne 0) {
            throw "makensis failed with exit code $LASTEXITCODE"
          }
          if (-not (Test-Path $outExe)) {
            throw "Failed to create single standalone AnasTV.exe"
          }
          $exeMb = [math]::Round((Get-Item $outExe).Length / 1MB, 2)
          Write-Host "Built single standalone AnasTV.exe ($exeMb MB)"

      - name: Upload Single Standalone AnasTV.exe
        uses: actions/upload-artifact@v4
        with:
          name: AnasTV-Windows-Single-EXE
          path: anas_tv_flutter/build/AnasTV.exe
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

name: anas_tv
description: Premium live TV homepage for Android mobile and Android TV.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.10+1
  http: ^1.2.2
  cached_network_image: ^3.4.1
  webview_flutter_windows: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Anton
      fonts:
        - asset: assets/fonts/anton.ttf
